{% extends 'base.html' %}

{% block title %}Редактирование тренера{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Редактирование тренера</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Имя *</label>
                            <input type="text" name="first_name" class="form-control" value="{{ coach.first_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Фамилия *</label>
                            <input type="text" name="last_name" class="form-control" value="{{ coach.last_name }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ coach.email }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Клуб *</label>
                        <input type="text" name="club" class="form-control" value="{{ coach.profile.club|default:'' }}" required>
                        <small class="text-muted">Бойцы будут привязаны к этому клубу.</small>
                    </div>

                    <hr class="my-4">

                    <h5 class="mb-3 text-secondary">Данные для входа</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Логин (изменить нельзя)</label>
                            <input type="text" class="form-control" value="{{ coach.username }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Новый пароль</label>
                            <input type="text" name="password" class="form-control" placeholder="Оставьте пустым, чтобы не менять">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-info text-white btn-lg">
                            <i class="fas fa-save me-2"></i>Сохранить изменения
                        </button>
                        <a href="{% url 'tournaments:coach_list' %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
