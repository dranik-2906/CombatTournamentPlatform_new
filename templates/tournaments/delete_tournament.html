{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-trash me-2"></i>Удаление турнира</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Вы уверены, что хотите удалить турнир<br><strong>"{{ tournament.name }}"</strong>?</p>
                <p class="text-danger"><i class="fas fa-exclamation-triangle me-1"></i>Это действие нельзя отменить!</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="fas fa-trash me-2"></i>Удалить
                    </button>
                    <a href="{% url 'tournaments:tournament_detail' tournament.id %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
