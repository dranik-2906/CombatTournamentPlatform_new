{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Настройки таймера - {{ tournament.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0"><i class="fas fa-clock me-2"></i>Настройки таймера</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a href="{% url 'tournaments:tournament_detail' tournament.id %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
