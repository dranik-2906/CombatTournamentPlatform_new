{% extends 'base.html' %}
{% block title %}Добавить бойца{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">Добавление бойца</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Имя *</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Фамилия *</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата рождения *</label>
                        <input type="date" name="date_of_birth" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Вес (кг) *</label>
                        <input type="number" step="0.1" name="weight" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Подать заявку на турнир</label>
                        <select name="tournament_id" class="form-select">
                            <option value="">Не подавать сейчас</option>
                            {% for t in tournaments %}
                                <option value="{{ t.id }}">{{ t.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-info text-white w-100">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
