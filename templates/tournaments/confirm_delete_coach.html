{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger">
        <h3>Удалить тренера {{ coach.first_name }} {{ coach.last_name }}?</h3>
        <p>Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'tournaments:coach_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
