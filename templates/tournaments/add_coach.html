{% extends 'base.html' %}

{% block title %}Новый тренер{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-info">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-chalkboard-teacher me-2"></i>Добавление тренера</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Имя *</label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Фамилия *</label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control">
                    </div>

                    <hr class="my-4">

                    <h5 class="mb-3 text-secondary">Данные для входа</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Логин *</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Пароль *</label>
                            <input type="text" name="password" class="form-control" required placeholder="Например: coach123">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-info text-white btn-lg">
                            <i class="fas fa-save me-2"></i>Сохранить
                        </button>
                        <a href="{% url 'tournaments:coach_list' %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
