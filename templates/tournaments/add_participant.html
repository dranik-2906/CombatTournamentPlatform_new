{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Добавить участника - {{ tournament.name }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'tournaments:tournament_list' %}">Турниры</a></li>
        <li class="breadcrumb-item"><a href="{% url 'tournaments:tournament_detail' tournament.id %}">{{ tournament.name }}</a></li>
        <li class="breadcrumb-item active">Добавление участника</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Новый участник</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Добавить</button>
                        <a href="{% url 'tournaments:participants_management' %}?tournament={{ tournament.id }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
